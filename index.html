<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programa de Apadrinhamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #060a14;
      --bg2:       #080d1a;
      --surface:   #0c1220;
      --surface2:  #101828;
      --surface3:  #162035;
      --border:    #1e2d47;
      --border2:   #253854;
      --accent:    #4a8fff;
      --accent2:   #7ab3ff;
      --accent3:   #2563cc;
      --cyan:      #00d4ff;
      --cyan2:     #00a8cc;
      --purple:    #8b5cf6;
      --purple2:   #a78bfa;
      --text:      #e2eaf8;
      --muted:     #5a7090;
      --muted2:    #7a95b5;
      --tag-lab:   #0d1f3c;
      --tag-lab-t: #4a8fff;
      --tag-int:   #0d2230;
      --tag-int-t: #00c4ee;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(74,143,255,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 85%, rgba(139,92,246,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 60% 40%, rgba(0,212,255,0.04) 0%, transparent 60%);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(74,143,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,143,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
    }

    header {
      position: relative;
      z-index: 1;
      padding: 5rem 2rem 4.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header::before {
      content: '';
      position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 600px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--cyan), var(--accent), transparent);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font-family: 'Space Mono', monospace;
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
      padding: .4rem 1rem;
      border: 1px solid rgba(74,143,255,0.25);
      border-radius: 2px;
      background: rgba(74,143,255,0.05);
    }

    .eyebrow::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--cyan);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .5; transform: scale(.7); }
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.6rem, 6vw, 4.8rem);
      font-weight: 600;
      line-height: 1.05;
      max-width: 720px;
      margin: 0 auto 1.8rem;
      letter-spacing: -.02em;
    }

    header h1 .dim { color: var(--muted2); font-weight: 300; }
    header h1 .hi  {
      color: transparent;
      background: linear-gradient(135deg, var(--accent2) 0%, var(--cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .header-sub {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      max-width: 540px;
      margin: 0 auto;
    }

    .header-sub::before,
    .header-sub::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2));
    }
    .header-sub::after { background: linear-gradient(90deg, var(--border2), transparent); }

    header p {
      font-family: 'Space Mono', monospace;
      font-size: .8rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .corner-deco {
      position: absolute;
      width: 16px; height: 16px;
    }

    .corner-deco::before,
    .corner-deco::after {
      content: '';
      position: absolute;
      background: var(--accent);
    }

    .corner-deco::before { width: 100%; height: 1px; top: 0; left: 0; }
    .corner-deco::after  { width: 1px; height: 100%; top: 0; left: 0; }

    .corner-tl { top: 2rem; left: 2rem; }
    .corner-tr { top: 2rem; right: 2rem; transform: scaleX(-1); }
    .corner-bl { bottom: 2rem; left: 2rem; transform: scaleY(-1); }
    .corner-br { bottom: 2rem; right: 2rem; transform: scale(-1); }

    main {
      position: relative;
      z-index: 1;
      max-width: 1300px;
      margin: 0 auto;
      padding: 4rem 2rem 6rem;
    }

    .grid-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .grid-label {
      font-family: 'Space Mono', monospace;
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .grid-header-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border2), transparent);
    }

    .grid-count {
      font-family: 'Space Mono', monospace;
      font-size: .65rem;
      color: var(--accent);
      letter-spacing: .1em;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
      animation: fadeUp .5s ease both;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent3), var(--cyan2));
      opacity: 0;
      transition: opacity .22s ease;
      z-index: 2;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(74,143,255,0.04) 0%, transparent 60%);
      opacity: 0;
      transition: opacity .22s ease;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(74,143,255,0.4);
      box-shadow:
        0 0 0 1px rgba(74,143,255,0.1),
        0 20px 40px rgba(0,0,0,.5),
        0 0 30px rgba(74,143,255,0.06);
    }

    .card:hover::before { opacity: 1; }
    .card:hover::after  { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:nth-child(1) { animation-delay: .05s; }
    .card:nth-child(2) { animation-delay: .10s; }
    .card:nth-child(3) { animation-delay: .15s; }
    .card:nth-child(4) { animation-delay: .20s; }
    .card:nth-child(5) { animation-delay: .25s; }
    .card:nth-child(6) { animation-delay: .30s; }

    .card-img-wrap { position: relative; overflow: hidden; }

    .card-img {
      width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block;
      filter: grayscale(30%) brightness(.85) saturate(.8);
      transition: filter .3s ease, transform .3s ease;
    }

    .card:hover .card-img {
      filter: grayscale(0%) brightness(1) saturate(1);
      transform: scale(1.03);
    }

    .card-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, var(--surface) 100%);
    }

    .card-img-placeholder {
      width: 100%; aspect-ratio: 4/5;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 2.5rem; font-weight: 700;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      background-image: linear-gradient(135deg, var(--accent2), var(--cyan));
      position: relative;
    }

    .card-img-placeholder::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(74,143,255,0.06) 0%, transparent 60%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 10px,
          rgba(74,143,255,0.02) 10px,
          rgba(74,143,255,0.02) 11px
        );
    }

    .card-body { padding: 1rem 1.1rem 1.2rem; position: relative; }

    .card-id {
      font-family: 'Space Mono', monospace;
      font-size: .55rem;
      color: var(--muted);
      letter-spacing: .15em;
      margin-bottom: .4rem;
    }

    .card-name {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      letter-spacing: -.01em;
    }

    .card-tags { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .65rem; }

    .tag {
      font-family: 'Space Mono', monospace;
      font-size: .58rem;
      letter-spacing: .03em;
      padding: .2rem .5rem;
      border-radius: 2px;
      font-weight: 400;
    }

    .tag-lab {
      background: var(--tag-lab);
      color: var(--tag-lab-t);
      border: 1px solid rgba(74,143,255,0.2);
    }

    .tag-int {
      background: var(--tag-int);
      color: var(--tag-int-t);
      border: 1px solid rgba(0,196,238,0.2);
    }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(4,7,16,.9);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
    }

    .overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 4px;
      max-width: 860px; width: 100%; max-height: 90vh;
      overflow-y: auto;
      display: grid; grid-template-columns: 300px 1fr;
      transform: translateY(20px) scale(.98);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      position: relative;
    }

    .modal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent3), var(--cyan), var(--purple));
      z-index: 2;
      border-radius: 4px 4px 0 0;
    }

    .overlay.open .modal { transform: translateY(0) scale(1); }

    .modal-img-col { position: sticky; top: 0; height: fit-content; }

    .modal-img {
      width: 100%; aspect-ratio: 3/4; object-fit: cover;
      border-radius: 4px 0 0 4px; display: block;
      filter: saturate(.85) brightness(.9);
    }

    .modal-img-placeholder {
      width: 100%; aspect-ratio: 3/4;
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 4rem; font-weight: 700;
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      background-image: linear-gradient(135deg, var(--accent2), var(--cyan));
      border-radius: 4px 0 0 4px;
      position: relative;
      overflow: hidden;
    }

    .modal-img-placeholder::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          -45deg,
          transparent,
          transparent 20px,
          rgba(74,143,255,0.03) 20px,
          rgba(74,143,255,0.03) 21px
        );
    }

    .modal-content {
      padding: 2.2rem 2.2rem 2.2rem 2rem;
      display: flex; flex-direction: column; gap: 1.6rem;
    }

    .modal-close {
      position: absolute; top: 1.2rem; right: 1.4rem;
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--muted); width: 32px; height: 32px; border-radius: 2px;
      font-family: 'Space Mono', monospace;
      font-size: .85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .2s, border-color .2s, background .2s;
      z-index: 10;
    }

    .modal-close:hover {
      color: var(--text); border-color: var(--accent);
      background: rgba(74,143,255,0.1);
    }

    .modal-overlay-wrapper { position: relative; }

    .modal-meta {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-family: 'Space Mono', monospace;
      font-size: .6rem;
      color: var(--muted);
      letter-spacing: .15em;
    }

    .modal-meta-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 4px var(--cyan);
    }

    .modal-name {
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -.02em;
    }

    .modal-tags { display: flex; flex-wrap: wrap; gap: .4rem; }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: .6rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .6rem;
    }

    .modal-bio { font-size: .95rem; line-height: 1.8; color: var(--muted2); }

    .modal-question {
      background: var(--surface2);
      border-left: 2px solid var(--cyan);
      border-radius: 0 4px 4px 0;
      padding: 1.2rem 1.4rem;
      position: relative;
      overflow: hidden;
    }

    .modal-question::after {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.03));
      pointer-events: none;
    }

    .modal-question .section-label { color: var(--cyan); margin-bottom: .6rem; }

    .modal-question p {
      font-family: 'Space Mono', monospace;
      font-size: .88rem;
      font-style: italic;
      line-height: 1.9;
      color: var(--muted2);
    }

    footer {
      position: relative; z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      border-top: 1px solid var(--border);
      font-family: 'Space Mono', monospace;
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: .1em;
    }

    footer::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 400px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border2), transparent);
    }

    @media (max-width: 640px) {
      .modal { grid-template-columns: 1fr; max-height: 92vh; }
      .modal-img { aspect-ratio: 16/9; border-radius: 4px 4px 0 0; object-position: top; }
      .modal-img-placeholder { aspect-ratio: 16/9; border-radius: 4px 4px 0 0; }
      .modal-img-col { position: relative; }
      .modal-content { padding: 1.5rem; }
      header { padding: 3.5rem 1.5rem 3rem; }
      .corner-deco { display: none; }
    }
  </style>
</head>
<body>

<div class="scanlines"></div>

<header>
  <div class="corner-deco corner-tl"></div>
  <div class="corner-deco corner-tr"></div>
  <div class="corner-deco corner-bl"></div>
  <div class="corner-deco corner-br"></div>
  <span class="eyebrow">UFPB &nbsp;·&nbsp; Veteranos</span>
  <h1><span class="dim">Programa de</span><br><span class="hi">Apadrinhamento</span></h1>
  <div class="header-sub">
    <p>Meet people before you actually meet them :P</p>
  </div>
</header>

<main>
  <div class="grid-header">
    <span class="grid-label">// Candidatos ao Apadrinhamento</span>
    <div class="grid-header-line"></div>
    <span class="grid-count" id="count-label">000</span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal-overlay-wrapper">
    <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>
    <div class="modal" id="modal"></div>
  </div>
</div>

<footer>
  <span>Programa de Apadrinhamento</span>
  <span style="color: var(--border2);">—</span>
  <span>Todos os direitos reservados</span>
</footer>

<script>
  const people = [
    {
      name: "Jay Pee",
      img: "",
      labs: ["AntiCristo"],
      interests: ["Mentira", "Terraria", "Brilhante"],
      bio: "Eu você, um itamar e dois cachoros.",
      question: "Sim"
    }
  ];

  const grid = document.getElementById('grid');
  const countLabel = document.getElementById('count-label');
  countLabel.textContent = String(people.length).padStart(3, '0');

  people.forEach((p, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `Ver perfil de ${p.name}`);

    const imgHtml = p.img
      ? `<div class="card-img-wrap"><img class="card-img" src="${p.img}" alt="${p.name}" loading="lazy" /><div class="card-img-overlay"></div></div>`
      : `<div class="card-img-placeholder">${initials(p.name)}</div>`;

    const labTags = p.labs.map(l => `<span class="tag tag-lab">${l}</span>`).join('');
    const intTags = p.interests.slice(0, 2).map(t => `<span class="tag tag-int">${t}</span>`).join('');

    card.innerHTML = `
      ${imgHtml}
      <div class="card-body">
        <p class="card-id">USER_${String(i + 1).padStart(4, '0')}</p>
        <p class="card-name">${p.name}</p>
        <div class="card-tags">${labTags}${intTags}</div>
      </div>
    `;

    card.addEventListener('click', () => openModal(i));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(i); });
    grid.appendChild(card);
  });

  const overlay  = document.getElementById('overlay');
  const modal    = document.getElementById('modal');
  const closeBtn = document.getElementById('modalClose');

  function openModal(i) {
    const p = people[i];

    const imgHtml = p.img
      ? `<img class="modal-img" src="${p.img}" alt="${p.name}" />`
      : `<div class="modal-img-placeholder">${initials(p.name)}</div>`;

    const labTags = p.labs.map(l => `<span class="tag tag-lab">${l}</span>`).join('');
    const intTags = p.interests.map(t => `<span class="tag tag-int">${t}</span>`).join('');
    const bioHtml = p.bio.split('\n\n').map(para => `<p class="modal-bio">${para}</p>`).join('');

    modal.innerHTML = `
      <div class="modal-img-col">${imgHtml}</div>
      <div class="modal-content">
        <div class="modal-meta">
          <div class="modal-meta-dot"></div>
          <span>USER_${String(i + 1).padStart(4, '0')}</span>
          <span style="color: var(--border2);">·</span>
          <span>PADRINHO</span>
        </div>
        <h2 class="modal-name">${p.name}</h2>
        <div>
          <p class="section-label">Projetos &amp; Laboratórios</p>
          <div class="modal-tags">${labTags}</div>
        </div>
        <div>
          <p class="section-label">Interesses</p>
          <div class="modal-tags">${intTags}</div>
        </div>
        <div>
          <p class="section-label">Sobre mim</p>
          ${bioHtml}
        </div>
        <div class="modal-question">
          <p class="section-label">O que o apadrinhamento representa para você?</p>
          <p>${p.question}</p>
        </div>
      </div>
    `;

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }

  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function initials(name) {
    return name.split(' ').slice(0, 2).map(w => w[0]).join('');
  }
</script>
</body>
</html>
