<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programa de Apadrinhamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="scanlines"></div>

<header>
  <div class="corner-deco corner-tl"></div>
  <div class="corner-deco corner-tr"></div>
  <div class="corner-deco corner-bl"></div>
  <div class="corner-deco corner-br"></div>
  <span class="eyebrow">UFPB &nbsp;·&nbsp; Veteranos</span>
  <h1><span class="dim">Programa de</span><br><span class="hi">Apadrinhamento</span></h1>
  <div class="header-sub">
    <p>Meet people before you actually meet them :P</p>
  </div>
</header>

<main>
  <div class="grid-header">
    <span class="grid-label">// Candidatos ao Apadrinhamento</span>
    <div class="grid-header-line"></div>
    <span class="grid-count" id="count-label">000</span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- "Tanto faz papai" button after grid -->
<div class="tanto-faz-wrap">
  <button class="btn-tanto-faz" id="btnTantoFaz">Tanto faz papai</button>
</div>

<!-- Profile detail modal -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal-overlay-wrapper">
    <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>
    <div class="modal" id="modal"></div>
  </div>
</div>

<!-- Application form overlay -->
<div class="apply-overlay" id="applyOverlay" role="dialog" aria-modal="true">
  <div class="apply-card">
    <button class="apply-card-close" id="applyClose" aria-label="Fechar">✕</button>
    <p class="apply-title">Fale mais sobre você</p>
    <p class="apply-subtitle">// Candidatura ao Apadrinhamento</p>

    <div class="apply-target" id="applyTarget"></div>

    <div class="apply-field">
      <label class="apply-label" for="applyNome">Meu nome</label>
      <input
        class="apply-input"
        id="applyNome"
        type="text"
        placeholder="Como você se chama?"
        autocomplete="given-name"
      />
    </div>

    <div class="apply-field">
      <label class="apply-label" for="applySobre">Sobre mim</label>
      <textarea
        class="apply-textarea"
        id="applySobre"
        placeholder="Conta um pouco sobre você — interesses, expectativas, o que quiser :)"
      ></textarea>
    </div>

    <button class="btn-submit" id="applyBtn">Enviar candidatura</button>
    <p class="apply-feedback" id="applyFeedback"></p>
  </div>
</div>

<footer>
  <span>Programa de Apadrinhamento</span>
  <span style="color: var(--border2);">—</span>
  <span>Todos os direitos reservados</span>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
